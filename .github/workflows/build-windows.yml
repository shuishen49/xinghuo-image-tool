name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 打包后发布到 GitHub Release（会自动创建 v<版本> 标签）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback on PRs: type-check the frontend, cargo-check the Rust side.
  check:
    name: Type check + cargo check
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Full release build: NSIS installer + single-file portable exe + zip.
  build:
    name: Build installer + portable
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Signing key for updater artifacts (.sig). Store the PRIVATE key as a
      # GitHub Actions secret; the matching public key lives in tauri.conf.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Optional: when all of these are set, the built installer + manifest
      # are pushed straight to the website's static download directory.
      UPDATE_SSH_HOST: ${{ secrets.UPDATE_SSH_HOST }}
      UPDATE_SSH_USER: ${{ secrets.UPDATE_SSH_USER }}
      UPDATE_SSH_PORT: ${{ secrets.UPDATE_SSH_PORT }}
      UPDATE_SSH_PRIVATE_KEY: ${{ secrets.UPDATE_SSH_PRIVATE_KEY }}
      UPDATE_REMOTE_DIR: ${{ secrets.UPDATE_REMOTE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: tauri build (frontend + Rust release + installer)
        id: tauri_build
        shell: bash
        run: |
          npx tauri build 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # Surface compiler errors in the job summary so a failure is readable
      # straight from the Actions page without downloading the full log.
      - name: Export failure log
        if: failure() && steps.tauri_build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## tauri build 失败'
            echo '```'
            grep -nE '^(error|error\[|warning: unused)' -A 8 build.log | tail -n 150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.1.1'
          try {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          } catch {
            Write-Warning "读取版本失败，回退到 $ver"
          }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$ver"

          New-Item -ItemType Directory -Force -Path stage | Out-Null
          New-Item -ItemType Directory -Force -Path out  | Out-Null

          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $nsis) { throw '未找到 NSIS 安装包 (bundle/nsis/*.exe)' }
          Copy-Item $nsis.FullName "stage/XinghuoImageTool-$ver-x64-setup.exe"

          # Cargo crate is named "app", so the release binary is app.exe.
          $portable = 'src-tauri/target/release/app.exe'
          if (-not (Test-Path $portable)) { throw "未找到绿色版 $portable" }
          Copy-Item $portable "stage/XinghuoImageTool-$ver-portable-x64.exe"

          Compress-Archive -Path 'stage/*' -DestinationPath "out/XinghuoImageTool-$ver-portable-x64.zip" -Force

          Get-ChildItem -Recurse stage, out | Select-Object FullName, Length | Format-Table -AutoSize

      # Static updater feed: Tauri signs the NSIS installer and we publish the
      # matching signature + download URL as latest.json. Upload this file and
      # the installer to the site's real static directory (NOT an SPA route).
      - name: Generate updater manifest (latest.json)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.collect.outputs.ver }}'
          $sig = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Filter '*.sig' -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $sig) { throw '未找到 .sig 签名文件：请确认 TAURI_SIGNING_PRIVATE_KEY 已配置，且 tauri build 生成了 updater 产物' }
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $manifest = [ordered]@{
            version   = "v$ver"
            notes     = "灵感10s v$ver"
            pub_date  = [DateTime]::UtcNow.ToString('o')
            platforms = @{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url       = "https://linggan10s.com/download/XinghuoImageTool-$ver-x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path 'stage/latest.json' -Encoding utf8
          Get-Content 'stage/latest.json'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XinghuoImageTool-windows-x64
          path: |
            stage/*
            out/*
          if-no-files-found: error

      # 手动触发 + 勾选 publish 时，先补一个 v<版本> 标签（Release 必须挂在标签上）。
      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.collect.outputs.ver }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "标签 $tag 已存在，跳过创建"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "已创建并推送 $tag"
          fi

      # 打 tag 推送时自动发布；也可在 Actions 页面手动触发并勾选 publish。
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.collect.outputs.ver) }}"
          name: "v${{ steps.collect.outputs.ver }}"
          generate_release_notes: true
          draft: false
          files: |
            stage/*
            out/*

      # Optional: push the installer + manifest to the website automatically.
      # Enable by setting UPDATE_SSH_* secrets; otherwise download the two
      # files from the Release and place them under /download/ manually.
      - name: Publish updater files to website
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && env.UPDATE_SSH_HOST != '' && env.UPDATE_REMOTE_DIR != '' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: bash
        run: |
          set -euo pipefail
          port="${UPDATE_SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$UPDATE_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$port" -H "$UPDATE_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          scp -i "$HOME/.ssh/deploy_key" -P "$port" -o StrictHostKeyChecking=yes \
            stage/*.exe stage/latest.json \
            "$UPDATE_SSH_USER@$UPDATE_SSH_HOST:$UPDATE_REMOTE_DIR/"
          echo "已上传安装包与 latest.json 到 $UPDATE_REMOTE_DIR"

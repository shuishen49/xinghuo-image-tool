name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 打包后发布到 GitHub Release（会自动创建 v<版本> 标签）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback on PRs: type-check the frontend, cargo-check the Rust side.
  check:
    name: Type check + cargo check
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Full release build: NSIS installer + single-file portable exe + zip.
  build:
    name: Build installer + portable
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Signing key for updater artifacts (.sig). Store the PRIVATE key as a
      # GitHub Actions secret; the matching public key lives in tauri.conf.json.
      # 同时兼容 Repository Variables：Settings 里 Secrets / Variables 是两个
      # 不同标签页，很容易配到 Variables 去，而 workflow 只读 secrets 时取不到值。
      # 注意私钥请放 Secrets（加密 + 日志屏蔽），Variables 是明文。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || vars.TAURI_SIGNING_PRIVATE_KEY }}
      # 私钥是 rsign 加密格式（密码为空）。CI 里不显式给密码，签名阶段可能
      # 一直等 tty 读密码把构建挂住（本机 signer sign 已踩过这个坑）。
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # Optional: when all of these are set, the built installer + manifest
      # are pushed straight to the website's static download directory.
      UPDATE_SSH_HOST: ${{ secrets.UPDATE_SSH_HOST || vars.UPDATE_SSH_HOST }}
      UPDATE_SSH_USER: ${{ secrets.UPDATE_SSH_USER || vars.UPDATE_SSH_USER }}
      UPDATE_SSH_PORT: ${{ secrets.UPDATE_SSH_PORT || vars.UPDATE_SSH_PORT }}
      UPDATE_SSH_PRIVATE_KEY: ${{ secrets.UPDATE_SSH_PRIVATE_KEY || vars.UPDATE_SSH_PRIVATE_KEY }}
      UPDATE_REMOTE_DIR: ${{ secrets.UPDATE_REMOTE_DIR || vars.UPDATE_REMOTE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # No signing key configured => build a plain installer instead of
      # failing on updater artifacts. The .sig + latest.json can then be
      # produced locally with `npx tauri signer sign` and uploaded manually.
      - name: Disable updater artifacts without signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: pwsh
        run: |
          $p = 'src-tauri/tauri.conf.json'
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.bundle.createUpdaterArtifacts = $false
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8
          Write-Host 'createUpdaterArtifacts=false（未配置签名密钥，跳过 updater 产物）'

      - name: tauri build (frontend + Rust release + installer)
        id: tauri_build
        shell: bash
        run: |
          npx tauri build 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # Surface compiler errors in the job summary so a failure is readable
      # straight from the Actions page without downloading the full log.
      - name: Export failure log
        if: failure() && steps.tauri_build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## tauri build 失败'
            echo '```'
            grep -nE '^(error|Error|error\[|failed|Failed)' -A 8 build.log | tail -n 150 || true
            tail -n 60 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable from the public check-runs API, so a
          # failure can be diagnosed without an admin token / gh CLI.
          tail -n 25 build.log | sed -E 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done || true

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.1.1'
          try {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          } catch {
            Write-Warning "读取版本失败，回退到 $ver"
          }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$ver"

          New-Item -ItemType Directory -Force -Path stage | Out-Null
          New-Item -ItemType Directory -Force -Path out  | Out-Null

          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $nsis) { throw '未找到 NSIS 安装包 (bundle/nsis/*.exe)' }
          Copy-Item $nsis.FullName "stage/XinghuoImageTool-$ver-x64-setup.exe"

          # Cargo crate is named "app", so the release binary is app.exe.
          $portable = 'src-tauri/target/release/app.exe'
          if (-not (Test-Path $portable)) { throw "未找到绿色版 $portable" }
          Copy-Item $portable "stage/XinghuoImageTool-$ver-portable-x64.exe"

          Compress-Archive -Path 'stage/*' -DestinationPath "out/XinghuoImageTool-$ver-portable-x64.zip" -Force

          Get-ChildItem -Recurse stage, out | Select-Object FullName, Length | Format-Table -AutoSize

      # Static updater feed: Tauri signs the NSIS installer and we publish the
      # matching signature + download URL as latest.json. Upload this file and
      # the installer to the site's real static directory (NOT an SPA route).
      - name: Generate updater manifest (latest.json)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.collect.outputs.ver }}'
          # targets=all 时 MSI 也会产出 .sig，必须优先取 NSIS setup 的那一个，
          # 否则 latest.json 里的签名会和实际下载的安装包对不上。
          $sig = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.sig' -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like '*setup*.exe.sig' } | Select-Object -First 1
          if (-not $sig) {
            $sig = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Filter '*.sig' -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $sig) { throw '未找到 .sig 签名文件：请确认 TAURI_SIGNING_PRIVATE_KEY 已配置，且 tauri build 生成了 updater 产物' }
          Write-Host "使用签名: $($sig.FullName)"
          Copy-Item $sig.FullName "stage/XinghuoImageTool-$ver-x64-setup.exe.sig" -Force
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $manifest = [ordered]@{
            version   = "v$ver"
            notes     = "灵感10s v$ver"
            pub_date  = [DateTime]::UtcNow.ToString('o')
            platforms = @{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url       = "https://update.linggan10s.com/linggan10s-image-tool/XinghuoImageTool-$ver-x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path 'stage/latest.json' -Encoding utf8
          Get-Content 'stage/latest.json'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XinghuoImageTool-windows-x64
          path: |
            stage/*
            out/*
          if-no-files-found: error

      # 本机没有 Rust 工具链，新增 Rust 依赖后 Cargo.lock 只能由 CI 解析生成。
      # 把解析结果回写到 main，避免每次构建都重新解析依赖树。
      # commit message 带 [skip ci]，否则这次 push 会再次触发本 workflow 形成循环。
      - name: Sync Cargo.lock from CI build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock 无变化'
            exit 0
          fi
          git commit -m 'chore: sync Cargo.lock from CI build [skip ci]'
          git push origin HEAD:main
          echo '已回写 Cargo.lock'

      # 手动触发 + 勾选 publish 时，先补一个 v<版本> 标签（Release 必须挂在标签上）。
      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.collect.outputs.ver }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "标签 $tag 已存在，跳过创建"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "已创建并推送 $tag"
          fi

      # 打 tag 推送时自动发布；也可在 Actions 页面手动触发并勾选 publish。
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.collect.outputs.ver) }}"
          name: "v${{ steps.collect.outputs.ver }}"
          generate_release_notes: true
          draft: false
          files: |
            stage/*
            out/*

      # Optional: push the installer + manifest to the website automatically.
      # Enable by setting UPDATE_SSH_* secrets; otherwise download the two
      # files from the Release and place them under /download/ manually.
      - name: Publish updater files to website
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && env.UPDATE_SSH_HOST != '' && env.UPDATE_REMOTE_DIR != '' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: bash
        run: |
          set -euo pipefail
          port="${UPDATE_SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$UPDATE_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$port" -H "$UPDATE_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          # 只传更新链路需要的三个文件。stage/*.exe 会把 portable 绿色版
          # 一起推到更新目录，既多余又容易让人工排查时搞混该验签哪个包。
          ver='${{ steps.collect.outputs.ver }}'
          scp -i "$HOME/.ssh/deploy_key" -P "$port" -o StrictHostKeyChecking=yes \
            "stage/XinghuoImageTool-$ver-x64-setup.exe" \
            "stage/XinghuoImageTool-$ver-x64-setup.exe.sig" \
            "stage/latest.json" \
            "$UPDATE_SSH_USER@$UPDATE_SSH_HOST:$UPDATE_REMOTE_DIR/"
          echo "已上传 setup.exe / .sig / latest.json 到 $UPDATE_REMOTE_DIR"

# 临时诊断用：只列出仓库里配置了哪些名字，绝不打印任何值。
# 查完就删掉这个文件。
name: Diagnose Actions configuration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    name: List configured names
    runs-on: ubuntu-latest
    steps:
      - name: Report secret / variable names
        shell: bash
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json, os

          def keys(raw):
              try:
                  d = json.loads(raw)
                  return sorted(d.keys()) if isinstance(d, dict) else []
              except Exception as e:
                  return ["<parse error: %s>" % type(e).__name__]

          print("::warning::Repo Secrets names   : " + (", ".join(keys(os.environ.get("SECRETS_JSON", ""))) or "(none)"))
          print("::warning::Repo Variables names : " + (", ".join(keys(os.environ.get("VARS_JSON", ""))) or "(none)"))
          for n in ("TAURI_SIGNING_PRIVATE_KEY", "UPDATE_SSH_HOST", "UPDATE_SSH_USER",
                    "UPDATE_SSH_PORT", "UPDATE_SSH_PRIVATE_KEY", "UPDATE_REMOTE_DIR"):
              v = os.environ.get(n, "")
              print("::warning::%s = %s (len=%d)" % (n, "SET" if v else "EMPTY", len(v)))
          PY
